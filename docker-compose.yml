services:
  mongodb:
    image: mongo:7
    container_name: stage_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: stage_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - stage_network

  backend:
    build: ./backend
    container_name: stage_backend
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:password@mongodb:27017/stage_db?authSource=admin
      JWT_SECRET: super_secret_key_change_me
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - stage_network

  frontend:
    build: ./frontend
    container_name: stage_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - stage_network

  nginx:
    image: nginx:stable-alpine
    container_name: stage_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stage_network

volumes:
  mongodb_data:

networks:
  stage_network:
    driver: bridge
